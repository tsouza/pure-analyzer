[package]
name = "pure-analyzer-lexer"
description = "logos-derived DFA lexer for the supported Pure token layer."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# logos: forbid_unsafe is required, not optional — its default codegen can
# emit unsafe, which would fail this crate's #![forbid(unsafe_code)] (see
# docs/dependencies/logos.md). text-size: the shared span type every layer
# above this one uses (docs/dependencies/text-size.md).
[dependencies]
logos = { workspace = true, features = ["forbid_unsafe"] }
text-size.workspace = true
