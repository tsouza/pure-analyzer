# Maturin packaging for the M4 PyO3 boundary. The compiled surface is the Rust
# `purecard` crate's `python`-featured cdylib (src/ffi.rs); this file only tells
# maturin how to build the wheel — it adds no Python sources. `just wheel`
# (`maturin build --release --features python`) reads it; a future build-only
# workflow should use the same configuration. The default `cargo` build ignores
# this file entirely.
[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "purecard"
requires-python = ">=3.9"
# Cargo.toml (`crates/pure-analyzer-purecard/Cargo.toml`'s `[package]`, plus
# `[workspace.package]` for the fields it inherits) is the single source of
# truth for all of these; maturin lifts them at build time, but only for
# fields actually listed here — per maturin's own contract, `[project]`
# being present at all means it "is not allowed to populate fields that are
# not present in `project.dynamic`". Leaving one off doesn't inherit a
# Cargo.toml default, it ships an empty METADATA field: this list omitted all
# but `version` for purecard 0.2.0/0.2.1, so the PyPI listing had no
# description, README, license, authors, or project links at all — verified
# empty (curl https://pypi.org/pypi/purecard/json) and reproduced locally
# (the wheel's dist-info/METADATA had only Name/Version/Requires-Python).
dynamic = ["version", "description", "readme", "license", "authors", "keywords", "urls"]

[dependency-groups]
# Python tests run on the explicit 3.12 toolchain in `just test-python`. Keep
# that development-only dependency outside Python 3.9 resolution: pytest 9
# fixes GHSA-6w46-j5rx-g56g but requires Python >=3.10. The marker does not
# change the shipped wheel's declared Python 3.9 floor.
test = ["pytest==9.1.1; python_version >= '3.10'"]
# Real-model inference harness (issue #58), opt-in via `just real-model-infer`
# / `just test-real-model` only — never pulled in by `just test-python` or `just
# ci`, so the fast hermetic lane stays network- and heavy-dependency-free. Runs
# on the explicit 3.12 toolchain those recipes pin (`numpy==2.5.2` itself needs
# Python >=3.12), same reasoning as `test`'s own marker above. Versions are the
# latest stable releases verified against PyPI at pin time (constitution §2
# "latest stable, verified"); bump the same way.
real-model = [
    "torch==2.13.0; python_version >= '3.12'",
    "transformers==5.16.1; python_version >= '3.12'",
    "huggingface-hub==1.29.0; python_version >= '3.12'",
    "numpy==2.5.2; python_version >= '3.12'",
    "pytest==9.1.1; python_version >= '3.10'",
]

[tool.maturin]
# Build the crate with the PyO3 boundary compiled in. abi3-py39 (declared by the
# feature) yields one forward-compatible wheel for CPython >= 3.9.
features = ["python"]
module-name = "purecard"
