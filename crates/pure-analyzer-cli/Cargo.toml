[package]
name = "pure-analyzer-cli"
description = "Command-line entry point for pure-analyzer."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# The distributed binary is not published as a library crate.
publish = false

[lints]
workspace = true

[[bin]]
name = "pure-analyzer"
path = "src/main.rs"

# The CLI is a front-end crate: it is the one place allowed to depend on
# `clap` (protocol) and, once rendering lands, `ariadne`/`codespan-reporting`
# (see ast-grep-rules/no-front-end-deps-in-core.yml). As a binary it may use
# `anyhow` at the boundary (libraries use `thiserror`).
[dependencies]
clap.workspace = true
libpure.workspace = true
pure-analyzer-render.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

# A staged formatter write needs an atomic exchange rather than a plain rename:
# it lets us inspect the exact destination entry displaced at the commit point
# and restore an edit that raced the final stale-snapshot validation. rustix
# exposes the Linux renameat2 and Apple renameatx_np exchange operations without
# introducing unsafe code into this crate.
[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
rustix.workspace = true
