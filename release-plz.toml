# release-plz configuration — PR-based release automation.
#
# On every push to `main`, release-plz opens/updates a "release PR" that bumps
# versions and updates changelogs from conventional commits. Merging that PR
# tags and (optionally) publishes. Humans stay in the loop; nothing publishes
# automatically off a normal feature merge. Driven by release-plz.yml.

[workspace]
# Conventional-commit-driven changelogs, one section per crate.
changelog_update = true
# Group the whole workspace into a single release PR for coherent versioning.
git_release_enable = true
# Keep dependent crates' versions in lockstep on a breaking bump.
dependencies_update = true
# Semver bump inferred from commit types (feat -> minor, fix -> patch, ! -> major).
semver_check = true

[changelog]
# Keep a Changelog / conventional-commits style headers.
header = """
# Changelog

All notable changes to this project are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/) and this project adheres to
[Semantic Versioning](https://semver.org/).
"""

# `purecard` is the only crate published to crates.io; it resumes a listing it
# held before migrating here. The analyzer crates stay unpublished — v0.1 is a
# moving target and none of them has a stable public API to promise semver on —
# so release-plz only bumps their versions, writes changelogs, and cuts GitHub
# releases/tags. `libpure` and `pure-analyzer-cli` are the likely next
# candidates.
#
# Every `publish` value below must equal the crate's own Cargo.toml `publish`
# field: an override is a full package configuration, not a patch, and
# release-plz rejects a mismatch at runtime — on `main`, after merge. `cargo
# xtask release-plz-check` (`just release-plz-check`) reproduces that check
# against `cargo metadata` so the drift fails a PR instead of the trunk.
[[package]]
name = "pure-analyzer-diagnostics"
publish = false

[[package]]
name = "pure-analyzer-lexer"
publish = false

[[package]]
name = "pure-analyzer-syntax"
publish = false

[[package]]
name = "pure-analyzer-parser"
publish = false

[[package]]
name = "pure-analyzer-model"
publish = false

[[package]]
name = "pure-analyzer-resolve"
publish = false

[[package]]
name = "pure-analyzer-analysis"
publish = false

[[package]]
name = "libpure"
publish = false

[[package]]
name = "pure-analyzer-render"
publish = false

[[package]]
name = "pure-analyzer-cli"
publish = false

[[package]]
name = "pure-analyzer-lsp"
publish = false

[[package]]
name = "purecard"
publish = true
# Pinned rather than left to release-plz's default, because
# `purecard-publish.yml` filters the `release: [published]` event on this exact
# prefix: a workspace release cuts one GitHub Release per crate, and only this
# one may start a PyPI upload. The workspace default happens to be the same
# template today, but a default is not a contract and that guard depends on it.
git_tag_name = "purecard-v{{ version }}"

[[package]]
name = "xtask"
release = false
publish = false
