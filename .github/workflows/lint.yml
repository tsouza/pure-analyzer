name: Lint
on:
  push: { branches: [main] }
  pull_request:
  merge_group:
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read   # paths-filter + commitlint read PR files/commits via the API
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      md: ${{ steps.filter.outputs.md }}
      actions: ${{ steps.filter.outputs.actions }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # fetch-depth: 0 so paths-filter can diff a push against its base commit
        # locally; persist-credentials: false means it cannot fetch the base
        # over the network, and a depth-1 checkout lacks it.
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            md:
              - '**/*.md'
              - '.markdownlint.yaml'
            actions:
              - '.github/**'
            scripts:
              - 'scripts/**'
              - '.github/workflows/lint.yml'
  markdownlint:
    needs: changes
    if: needs.changes.outputs.md == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
  commitlint:
    # Runs on every PR (all PRs have commits); harmless on push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
  actionlint:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # reviewdog's github-check reporter needs this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          reporter: github-check
          fail_level: error
  zizmor:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          advanced-security: false
          persona: regular
  test-scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - run: just test-scripts
  # Warnings-are-errors net (constitution §2): sweep this run's job logs for a
  # tool warning that exited 0. Same reusable sweep as ci/security/release-plz.
  no-warnings:
    needs: [changes, markdownlint, commitlint, actionlint, zizmor, test-scripts]
    if: always()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/no-warnings.yml
  lint-gate:
    name: lint-gate
    needs: [changes, markdownlint, commitlint, actionlint, zizmor, test-scripts, no-warnings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any lint job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
