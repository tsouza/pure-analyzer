name: PureCARD wheels

# The per-PR lane: prove the Python boundary and abi3 packaging stay healthy on
# every platform we ship. Deliberately build-only — it holds no registry
# credentials and never publishes. Releasing those very same wheels is
# `purecard-publish.yml`, which calls the same reusable matrix.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: purecard-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter reads changed files through the PR API

jobs:
  changes:
    name: PureCARD wheel path filter
    runs-on: ubuntu-latest
    outputs:
      wheel: ${{ steps.filter.outputs.wheel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            wheel:
              - 'crates/pure-analyzer-purecard/src/**'
              - 'crates/pure-analyzer-purecard/python/**'
              - 'crates/pure-analyzer-purecard/Cargo.toml'
              - 'crates/pure-analyzer-purecard/pyproject.toml'
              - 'crates/pure-analyzer-purecard/uv.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - '.mise.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/purecard-wheels.yml'
              - '.github/workflows/purecard-wheels-build.yml'

  build:
    name: Test and build PureCARD wheels
    needs: changes
    if: needs.changes.outputs.wheel == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/purecard-wheels-build.yml

  no-warnings:
    name: no-warnings (log sweep)
    needs: [changes, build]
    if: always()
    permissions:
      actions: read # reusable sweep reads this workflow run's completed logs
      contents: read
    uses: ./.github/workflows/no-warnings.yml

  purecard-wheels-gate:
    name: purecard-wheels-gate
    needs: [changes, build, no-warnings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any PureCARD wheel job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
