name: release-plz

# On every push to main: (1) best-effort open/update a release PR proposing
# the next version bump + changelog, and (2) release — tag and publish to
# crates.io — any package whose Cargo.toml version isn't tagged/published
# yet, regardless of whether it got there through that PR or another route
# (e.g. a hand-opened PR, when (1) can't run — see below). These are two
# independent `release-plz/action` invocations, deliberately not the
# single combined-`command` step release-plz/action defaults to: that
# composite runs `release-pr` then `release` in one `set -e` bash step, so a
# `release-pr` failure aborts before `release` ever runs — release-pr needs
# `pull-requests: write`, which a repo can have disabled independently of
# `release`, which only needs `contents: write` (for the tag) and the
# registry token. Splitting them means a PR-creation outage degrades this
# workflow to "no auto-proposed next-version PR", not "no releases publish."
#
# TOKEN — this workflow runs on the default GITHUB_TOKEN, and that has one
# consequence worth knowing before you rely on it: GitHub deliberately does not
# start workflow runs from events created with GITHUB_TOKEN. release-plz creates
# the GitHub Release, so under this token that release fires no `on: release`
# workflow. crates.io publishing is unaffected (release-plz uploads directly,
# below), but PyPI publishing is not — `purecard-publish.yml` is release-
# triggered, so it has to be started from its own `workflow_dispatch` after a
# release, and it is written to expect exactly that.
#
# To make the PyPI half automatic, add a RELEASE_PLZ_TOKEN secret (a PAT or
# GitHub App token with contents + pull-requests write) and use it for both the
# checkout `token:` and the action's `GITHUB_TOKEN:` below. That is a
# credential change, so it is left to the maintainer rather than made here.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      # No dtolnay/rust-toolchain step: rust-toolchain.toml already pins stable,
      # and rustup auto-installs it when release-plz's action first calls cargo.
      # A second `rustup default` from the action would fight the file over which
      # pin wins (see the same note in ci.yml).
      # Best-effort: proposes the next version bump. `continue-on-error`
      # because a disabled "Allow GitHub Actions to create pull requests"
      # repo setting makes this fail with a 403 independently of anything
      # this workflow controls, and that must never block the release step
      # below, which is what actually needs to run on every push.
      - name: Propose the next release PR
        id: release-pr
        continue-on-error: true
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release published packages
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishes `purecard`, the one crate whose manifest sets
          # `publish = true`. Every analyzer crate is `publish = false`, so
          # release-plz skips them regardless of this token being present;
          # `just release-plz-check` keeps that manifest/config agreement
          # honest pre-merge.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Warnings-are-errors net (constitution §2): sweep this run's job log for a
  # tool warning that exited 0 (e.g. a release-plz deprecation notice). Same
  # reusable sweep as ci/lint/security. This workflow is push-to-main only, so
  # it is the one gate without a pre-merge counterpart — deliberate: it guards
  # the release action, which has no PR-time run to mirror.
  no-warnings:
    needs: [release-plz]
    if: always()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/no-warnings.yml
