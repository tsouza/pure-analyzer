name: PureCARD fuzz

# Compile all nested PureCARD fuzz targets on relevant changes, then run each
# target for a bounded PR budget. A daily run reuses the same lane with a deeper
# budget and an accumulated, repository-scoped corpus.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: purecard-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter reads changed files through the PR API

env:
  CARGO_TERM_COLOR: always
  FUZZ_TIME_BUDGET_PR: "60"
  FUZZ_TIME_BUDGET_NIGHTLY: "900"
  FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  changes:
    name: PureCARD fuzz path filter
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'crates/pure-analyzer-purecard/src/**'
              - 'crates/pure-analyzer-purecard/fuzz/**'
              - 'crates/pure-analyzer-purecard/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'xtask/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/purecard-fuzz.yml'

  build:
    name: PureCARD fuzz target build
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - name: Cache PureCARD fuzz build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pure-analyzer-purecard/fuzz
      - name: Install fuzz tools
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-fuzz@0.13.2,just@1.55.1
      - name: Compile every PureCARD fuzz target
        run: just purecard-fuzz-build "$FUZZ_TARGET_TRIPLE"

  fuzz:
    name: PureCARD fuzz (${{ matrix.target }})
    needs: [changes, build]
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            accept_token,
            allowed_mask,
            l2_mask_liveness,
            schema_from_json,
            schema_walk_generation,
            spec_equivalence,
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - name: Cache PureCARD fuzz build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/pure-analyzer-purecard/fuzz
      - name: Install fuzz tools
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-fuzz@0.13.2,just@1.55.1
      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/pure-analyzer-purecard/fuzz/corpus/${{ matrix.target }}
          key: purecard-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            purecard-fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz with the event budget
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_TIME_BUDGET: ${{ github.event_name == 'schedule' && env.FUZZ_TIME_BUDGET_NIGHTLY || env.FUZZ_TIME_BUDGET_PR }}
        run: just purecard-fuzz "$FUZZ_TARGET" "$FUZZ_TIME_BUDGET" "$FUZZ_TARGET_TRIPLE"
      - name: Save fuzz corpus
        if: ${{ always() && hashFiles(format('crates/pure-analyzer-purecard/fuzz/corpus/{0}/**', matrix.target)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/pure-analyzer-purecard/fuzz/corpus/${{ matrix.target }}
          key: purecard-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purecard-fuzz-artifacts-${{ matrix.target }}
          path: crates/pure-analyzer-purecard/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  no-warnings:
    name: no-warnings (log sweep)
    needs: [changes, build, fuzz]
    if: always()
    permissions:
      actions: read # reusable sweep reads this workflow run's completed logs
      contents: read
    uses: ./.github/workflows/no-warnings.yml

  purecard-fuzz-gate:
    name: purecard-fuzz-gate
    needs: [changes, build, fuzz, no-warnings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any PureCARD fuzz job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
