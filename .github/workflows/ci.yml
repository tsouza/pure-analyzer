name: CI

# Thin CI: the fast lane is `cargo xtask ci` (typed, testable orchestration in
# Rust). Heavier / specialized gates run as parallel jobs so they can use their
# own tooling and caching. Every gate here has a matching `just` target and
# vice-versa.

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  merge_group:

concurrency:
  # Keep merge-group validation distinct from the pull-request run, so an
  # auto-merge enqueue cannot cancel its in-flight fast CI validation.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter reads changed files via the PR API

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --- Path filter: gate code jobs so doc-only PRs skip them ----------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # fetch-depth: 0 so paths-filter can diff a push against its base commit
        # locally; persist-credentials: false means it cannot fetch the base
        # over the network, and a depth-1 checkout lacks it.
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - 'crates/**'
              - 'xtask/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'deny.toml'
              - 'supply-chain/**'
              - 'clippy.toml'
              - 'rust-toolchain.toml'
              - '.mise.toml'
              - 'mise.lock'
              - 'rustfmt.toml'
              - 'public-api/**'
              - '.config/nextest.toml'
              - 'ast-grep-rules/**'
              - 'sgconfig.yml'
              - 'scripts/**'
              - 'release-plz.toml'
              - '.github/workflows/ci.yml'

  # --- Primary gate: fmt + lint + build + all nextest layers via xtask -----
  check:
    name: xtask ci (fmt, lint, test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # sccache keys on compiler invocation, not on incremental fingerprints;
      # leaving incremental on defeats its cache hits (see mozilla/sccache#465).
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dtolnay/rust-toolchain step anywhere in this file: rust-toolchain.toml
      # already pins stable + rustfmt/clippy/rust-src, and rustup auto-installs
      # it on the first cargo/rustup call. A second `rustup default` from the
      # action would fight the file over which one wins, surfacing rustup's
      # "implicitly overridden" warning on every invocation for no behavioral
      # difference.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest
      - name: cargo xtask ci
        run: cargo xtask ci

  # --- Coverage floor (cargo-llvm-cov) -------------------------------------
  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml supplies the stable channel; only the
      # coverage-specific component is missing from it.
      - run: rustup component add llvm-tools-preview
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Coverage + floor enforcement
        run: cargo xtask coverage

  # --- Diff-scoped mutation testing (cargo-mutants) -----------------------
  # The planner always emits a valid matrix sentinel. Only a direct PR with a
  # verified production-source diff can run workers; full or ambiguous plans
  # are deliberately deferred to nightly/manual full mutation. Its direct-PR
  # budget is at most three shards of twelve mutants each.
  mutation-plan:
    name: mutation-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      diff_sha256: ${{ steps.plan.outputs.diff_sha256 }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      merge_base: ${{ steps.plan.outputs.merge_base }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # PR planning uses the event-pinned head, not Actions' synthetic merge ref.
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        if: github.event_name == 'pull_request'
        with:
          tool: cargo-mutants@27.1.0
      - id: plan
        name: Plan verified mutation scope
        env:
          MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MUTATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_PR_DRAFT: ${{ github.event.pull_request.draft }}
          MUTATION_DEFER_FULL: "true"
        run: just plan-mutation

  mutation:
    name: mutation (diff ${{ matrix.index }}/${{ matrix.total }})
    needs: mutation-plan
    if: >-
      github.event_name == 'pull_request' &&
      needs.mutation-plan.result == 'success' &&
      needs.mutation-plan.outputs.scope == 'diff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      MUTATION_SHARD_INDEX: ${{ matrix.index }}
      MUTATION_SHARD_TOTAL: ${{ matrix.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest,just
      - name: Prepare verified mutation diff
        env:
          MUTATION_DIFF_SHA256: ${{ needs.mutation-plan.outputs.diff_sha256 }}
          MUTATION_HEAD_SHA: ${{ needs.mutation-plan.outputs.head_sha }}
          MUTATION_MERGE_BASE: ${{ needs.mutation-plan.outputs.merge_base }}
        run: just prepare-mutation-diff
      - name: cargo mutants (diff shard ${{ matrix.index }}/${{ matrix.total }})
        run: >-
          bun scripts/run-mutation-debug.mjs diff-shard
          "$MUTATION_SHARD_INDEX" "$MUTATION_SHARD_TOTAL" target/mutation-scope.diff
      - name: Collect mutation diagnostics
        if: always()
        run: bun scripts/run-mutation-debug.mjs --collect diff-shard "$MUTATION_SHARD_INDEX"
      - name: Upload mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-out-diff-shard-${{ matrix.index }}
          path: target/mutants-diff-shard-${{ matrix.index }}
          if-no-files-found: error
      - name: Upload mutation diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-diagnostics-diff-shard-${{ matrix.index }}
          path: target/mutation-diagnostics-diff-shard-${{ matrix.index }}
          if-no-files-found: warn

  # --- Supply chain: deny + audit + vet + unused deps ----------------------
  supply-chain:
    name: deny / audit / vet / unused-deps
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: --locked cargo-vet
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny,cargo-audit,cargo-machete,just
      - name: cargo deny
        run: just deny
      - name: cargo audit
        run: just audit
      - name: cargo vet
        run: just vet
      - name: cargo machete (unused deps)
        run: just machete
      # Fail a PR on release-plz config drift instead of the post-merge trunk
      # run (release-plz.yml only fires on push to main).
      - name: release-plz config check
        run: just release-plz-check

  # --- API stability: semver-checks + public-api snapshot ------------------
  api-stability:
    name: semver / public-api
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-semver-checks,cargo-public-api,just
      - name: cargo semver-checks
        run: just semver
      # public-api needs a nightly toolchain for rustdoc JSON. Its committed,
      # all-features baselines are mandatory: a missing or stale file fails the
      # PR instead of quietly dropping exact API-surface protection.
      - name: Install nightly (for cargo public-api)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - name: public API snapshot
        run: just public-api

  # --- Structural rules + work-ledger + shell + postponed-marker gates ------
  structural:
    name: ast-grep / work-ledger / shell / postponed-markers
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install ast-grep
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: ast-grep,just
      - name: ast-grep structural rules
        run: ast-grep scan
      - name: Checked-in work-ledger gate
        run: just no-work-ledger
      - name: Shell-script gate
        run: just no-shell-scripts
      - name: Postponed-marker gate
        run: just postponed-markers

  # --- Docs build (missing-docs is a hard error) ---------------------------
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just
      - name: cargo doc (warnings denied)
        run: just docs

  # --- Fuzz smoke (cargo-fuzz / libFuzzer) ---------------------------------
  # A bounded 60s-per-target run so a newly reachable crash reddens the PR rather
  # than waiting for a periodic run. The corpus is restored from and saved back to
  # the Actions cache (constitution §2) so runs accrete coverage instead of
  # re-fetching from anywhere.
  fuzz:
    name: fuzz-smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly for its `-Zsanitizer` flags; the pinned stable in
      # rust-toolchain.toml cannot build fuzz targets. This is the sanctioned case
      # (constitution §1) of a job installing a channel the file does not provide —
      # same as the public-api job.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-fuzz@0.13.2,just
      # Restore the accumulated corpus and save a fresh snapshot each run, so
      # coverage compounds across PRs without ever re-downloading from a third
      # party (the fetch is cache-only; a miss just starts from an empty corpus).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: diagnostics fuzz-smoke (60s)
        # Force the gnu triple: the musl-installed cargo-fuzz otherwise builds for
        # a static-libc musl target, incompatible with the ASAN sanitizer.
        run: just fuzz diagnostics 60 x86_64-unknown-linux-gnu
      - name: M3 parser fuzz-smoke (60s)
        run: just fuzz m3_parser 60 x86_64-unknown-linux-gnu
      - name: Domain parser fuzz-smoke (60s)
        run: just fuzz domain_parser 60 x86_64-unknown-linux-gnu

  # --- Warnings-are-errors net (constitution §2) --------------------------
  # Sweep this run's job logs for any tool warning that exited 0 (docker build,
  # apt, useradd, …). Shared with lint/security/release-plz via the reusable
  # no-warnings workflow so every pipeline is covered by one definition. Runs
  # after everything (their logs must exist); `always()` so it also catches
  # warnings in a job that failed.
  no-warnings:
    name: no-warnings (log sweep)
    needs: [changes, check, coverage, mutation-plan, mutation, supply-chain, api-stability, structural, docs, fuzz]
    if: always()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/no-warnings.yml

  # --- Aggregate gate: the single required check ---------------------------
  ci-gate:
    name: ci-gate
    needs: [changes, check, coverage, mutation-plan, mutation, supply-chain, api-stability, structural, docs, fuzz, no-warnings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any code job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
