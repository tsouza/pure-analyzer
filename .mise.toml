# .mise.toml — reproducible toolchain: agent == CI == laptop.
#
# `mise install` provisions the pinned tools below. The Rust toolchain itself
# is deferred to rust-toolchain.toml (the source of truth for channel +
# components) so rustup and mise never disagree; we only assert the channel
# here for parity.
#
# Most Cargo-based tools are installed from source by the
# `install-cargo-tools` task at pinned versions with `--locked`. cargo-vet is
# the exception: its current stable crate release has no matching upstream
# binary release, so mise installs the checksum-locked QuickInstall asset below.

[tool_alias]
cargo-vet = "github:cargo-bins/cargo-quickinstall"

[tools]
# Rust is owned entirely by rust-toolchain.toml (channel = "stable" = latest
# stable). rustup is a hard requirement of this repo anyway (nightly is needed
# for the excluded `fuzz`/`lints` crates and for cargo-public-api), so mise does
# not provision rust — a mise pin here would only shadow and fight rustup.

# Task runner (the human frontend).
just = "1.55.1"

# Structural search/lint used by the hygiene sweep.
"ast-grep" = "0.44.1"

# Secret scanning (hook + CI).
gitleaks = "8.30.1"

# Static security analysis for GitHub Actions. The local `just zizmor` gate
# uses the same version as the pinned CI action.
zizmor = "1.29.0"

# PR-based release automation (version bump + changelog + publish).
release-plz = "0.3.159"

# Bun runs every `.mjs` automation script (the repo forbids shell scripts).
bun = "1.3.14"

# Declarative git hooks (no hand-written hook scripts).
lefthook = "2.1.9"

# Builds pure-analyzer-purecard's abi3 Python wheel (`just wheel`) and its
# in-place extension for the hermetic pytest lane (`just test-python`).
maturin = "1.15.0"

# Host interpreter for PureCARD's PyO3 build and Python boundary tests. The
# produced abi3-py39 wheel remains compatible with CPython >= 3.9.
python = "3.12.14"

# Portable, lockable Python environment runner for `just test-python`.
uv = "0.12.5"

# Committed dependency-review coverage gate. The release tag and asset prefix
# are both exact; platform autodetection selects one of the seven archives in
# mise.lock. Those checksums were authenticated against cargo-quickinstall's
# pinned Minisign key before being committed; installs must use locked mode.
[tools.cargo-vet]
version = "cargo-vet-0.10.2"
version_prefix = ""
matching_regex = "^cargo-vet-0\\.10\\.2-.*\\.(tar\\.gz|zip)$"
filter_bins = "cargo-vet"

[env]
# Keep cargo output deterministic in CI logs.
CARGO_TERM_COLOR = "always"

# ---------------------------------------------------------------------------
# Remaining Cargo-installed tools. These lack a verified binary pin above, so
# we install them with `cargo install --locked` at explicit versions via a Bun
# script (the repo forbids shell scripts — see constitution §2).
# ---------------------------------------------------------------------------
[tasks.install-cargo-tools]
description = "Install all cargo-based dev tools at pinned versions (--locked)."
run = "bun scripts/install-cargo-tools.mjs"
