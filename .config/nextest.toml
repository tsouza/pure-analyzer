# cargo-nextest configuration.
#
# ZERO-TOLERANCE FLAKE POLICY: retries are deliberately set to 0 everywhere.
# A test that fails intermittently is a bug to be fixed immediately, never
# masked by a retry. Do NOT add `retries` to any profile — a flake budget is
# an invitation to ship flakes. (See CLAUDE.md testing discipline.)

[profile.default]
# Fail fast locally so the inner loop is short.
fail-fast = true
retries = 0
# Surface anything slow enough to be suspicious.
slow-timeout = { period = "30s", terminate-after = 2 }
# Show output for failures so the cause is visible without a rerun.
failure-output = "immediate-final"
status-level = "fail"

[profile.default.junit]
path = "junit.xml"

# CI profile: run the WHOLE suite (no fail-fast) so one failure doesn't hide
# others, still with zero retries. Selected via `--profile ci` in CI.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }
failure-output = "immediate-final"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"

# Chaos / DST profile: these are slower and seed-driven. Still zero retries —
# a failing seed is captured and replayed deterministically, not retried away.
[profile.chaos]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 2 }

# The opt-in `legend` feature's tests all hit ONE shared, stateful Legend
# Engine instance (`just test-legend` / `just test-real-model` each own their
# single Docker container). Nextest schedules every test in the run as one
# flat cross-binary pool, so without this group multiple legend-hitting test
# binaries (or two tests in the same binary) can fire concurrently against
# that single engine — confirmed live: adding one more sequential-request-heavy test
# (`every_fixture_gold_corpus_compiles_against_its_assembled_store_grammar`,
# ~270 HTTP round trips) tipped 5 previously-passing legend tests over the
# default profile's 60s slow-timeout purely from request queueing, not any
# test's own slowness in isolation. `max-threads = 1` serializes every legend
# test against every other one, so this is a property of the shared resource,
# not a per-test budget to keep retuning as tests are added.
[test-groups]
legend-engine = { max-threads = 1 }

# Separately, the corpus-wide compile-rate proof
# (`every_fixture_gold_corpus_compiles_against_its_assembled_store_grammar`)
# makes ~270 real HTTP round trips against a JVM-backed engine in one test —
# confirmed live: this alone exceeds even the profile-`ci` 60s/3 slow-timeout
# once serialized behind `legend-engine`'s other tests, with no per-request
# slowness to fix (each call is fast in isolation; the count is the cost).
# This whole lane is opt-in and explicitly not part of the fast inner loop
# `profile.default`'s tight budget exists for (its own doc comment), so a
# generous override here is not loosening that budget, just scoping it to
# the lane it was never meant to bound.
[[profile.default.overrides]]
filter = 'binary_id(pure-analyzer-purecard::legend_completeness) or binary_id(pure-analyzer-purecard::live_legend_schema_walk_compile) or binary_id(pure-analyzer-purecard::real_model_legend_compile)'
test-group = 'legend-engine'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary_id(pure-analyzer-purecard::legend_completeness) or binary_id(pure-analyzer-purecard::live_legend_schema_walk_compile) or binary_id(pure-analyzer-purecard::real_model_legend_compile)'
test-group = 'legend-engine'
slow-timeout = { period = "60s", terminate-after = 5 }
